services:
  - type: web
    name: prospector5000
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: RESEARCH_PROVIDER
        value: public
      - key: OWNER_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEVIN_API_KEY
        sync: false
      - key: DEVIN_ORG_ID
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ACU_PRICE_USD
        value: "2.25"
      - key: REPORT_CONTACT
        sync: false
      - key: CONTACT_EMAIL
        sync: false
